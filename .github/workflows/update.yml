name: LOTTO AI 自動更新

on:
  push:
    paths:
      - "scripts/sync_lotto.py"
      - ".github/workflows/update.yml"
      - "index.html"
  schedule:
    # 22:30 Taiwan time (UTC+8) every day
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      full_sync:
        description: "完整重建 2007 年起的歷史資料（建議勾選）"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lotto-ai-update
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate sync script syntax
        run: python -m py_compile scripts/sync_lotto.py
      - name: Validate website JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>([\\s\\S]*?)</script>", html)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline script, found {len(scripts)}")
          Path("/tmp/lotto-ai.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/lotto-ai.js
      - name: Sync latest official lottery results
        env:
          FULL_SYNC: ${{ github.event.inputs.full_sync }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          CODE_CHANGED=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
              CODE_CHANGED=true
            elif ! git diff --quiet "$PUSH_BEFORE" "$GITHUB_SHA" -- scripts/sync_lotto.py .github/workflows/update.yml; then
              CODE_CHANGED=true
            fi
          fi
          if [ "$FULL_SYNC" = "true" ] || [ "$CODE_CHANGED" = "true" ] || [ ! -s data/draws.json ] || [ "$(python -c "import json; print(len(json.load(open('data/draws.json')).get('draws', [])))")" = "0" ]; then
            python scripts/sync_lotto.py --full
          else
            python scripts/sync_lotto.py
          fi
      - name: Validate synchronized lottery data
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          payload = json.loads(Path("data/draws.json").read_text(encoding="utf-8"))
          draws = payload.get("draws")
          if not isinstance(draws, list) or not draws:
              raise SystemExit("No draw records found")
          if payload.get("draw_count") != len(draws):
              raise SystemExit("draw_count does not match the actual records")
          periods = [str(d.get("period", "")) for d in draws]
          if any(not p for p in periods) or len(periods) != len(set(periods)):
              raise SystemExit("Missing or duplicate draw periods")
          previous_date = ""
          for draw in draws:
              date = draw.get("date", "")
              datetime.strptime(date, "%Y-%m-%d")
              if date < previous_date:
                  raise SystemExit("Draw records are not sorted by date")
              previous_date = date
              numbers = draw.get("numbers")
              if not isinstance(numbers, list) or len(numbers) != 6:
                  raise SystemExit(f"{draw.get('period')}: expected six main numbers")
              if len(set(numbers)) != 6 or any(not isinstance(n, int) or not 1 <= n <= 49 for n in numbers):
                  raise SystemExit(f"{draw.get('period')}: invalid main numbers")
              special = draw.get("special")
              if not isinstance(special, int) or not 1 <= special <= 49:
                  raise SystemExit(f"{draw.get('period')}: invalid special number")
          print(f"Validated {len(draws)} draws: {draws[0]['date']} to {draws[-1]['date']}")
          PY
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/draws.json
          git diff --cached --quiet || git commit -m "Update official Lotto 6/49 results"
          git push
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
