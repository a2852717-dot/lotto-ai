name: LOTTO AI 自動更新

on:
  push:
    paths:
      - "scripts/sync_lotto.py"
      - ".github/workflows/update.yml"
      - "index.html"
  schedule:
    # 22:30 Taiwan time (UTC+8) every day
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      full_sync:
        description: "完整重建 2007 年起的歷史資料（建議勾選）"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lotto-ai-update
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Sync latest official lottery results
        env:
          FULL_SYNC: ${{ github.event.inputs.full_sync }}
        run: |
          if [ "$FULL_SYNC" = "true" ] || { [ "$GITHUB_EVENT_NAME" = "push" ] && ! git diff --quiet HEAD^ HEAD -- scripts/sync_lotto.py .github/workflows/update.yml; } || [ ! -s data/draws.json ] || [ "$(python -c "import json; print(len(json.load(open('data/draws.json')).get('draws', [])))")" = "0" ]; then
            python scripts/sync_lotto.py --full
          else
            python scripts/sync_lotto.py
          fi
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/draws.json
          git diff --cached --quiet || git commit -m "Update official Lotto 6/49 results"
          git push
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
